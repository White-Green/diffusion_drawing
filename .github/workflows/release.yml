name: Build Windows plugin

on:
  push:
    branches: [main, 'feat/**', 'rewrite/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          architecture: x64

      - uses: astral-sh/setup-uv@v6

      - name: Install Qt for input event tests
        run: python -m pip install PyQt5==5.15.11
      - name: Test plugin integration
        run: python -m unittest discover -s tests -v

      - name: Build pure Python ONNX runtime package
        run: uv build --project lineartgen/packages/lineartgen-runtime --wheel --out-dir wheels

      - name: Download locked Python 3.10 DirectML dependencies
        run: |
          uv export --project lineartgen/packages/lineartgen-runtime --frozen --extra directml --no-dev --no-emit-project --output-file runtime-requirements.txt
          python -m pip download --only-binary=:all: --dest wheels --require-hashes -r runtime-requirements.txt

      - name: Package and smoke-test bundled model
        # Hosted Windows runners may not expose a usable DirectML display adapter.
        # Still require the DirectML wheel and run every inference check on CPU fallback.
        run: >-
          python scripts/package.py --wheel-dir wheels
          --provider directml --allow-cpu-fallback
          --output dist/diffusion_drawing-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          path: dist/diffusion_drawing-windows-x64.zip
          archive: false
          if-no-files-found: error

      - name: Download the user-facing artifact
        uses: actions/download-artifact@v8
        with:
          name: diffusion_drawing-windows-x64.zip
          path: artifact-check
          skip-decompress: true

      - name: Verify artifact and import with Krita
        run: |
          $original = (Get-FileHash dist/diffusion_drawing-windows-x64.zip).Hash
          $downloaded = (Get-FileHash artifact-check/diffusion_drawing-windows-x64.zip).Hash
          if ($original -ne $downloaded) { throw 'Downloaded artifact differs from packaged ZIP' }
          python scripts/check_krita_import.py artifact-check/diffusion_drawing-windows-x64.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: diffusion_drawing-windows-x64.zip
          path: dist
          skip-decompress: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(date --utc +%Y-%m-%dT%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$TAG" --target "$GITHUB_SHA" dist/diffusion_drawing-windows-x64.zip
