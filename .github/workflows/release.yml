name: Build Windows plugin

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout public controller submodule
        run: git submodule update --init --recursive -- diffusion_drawing/diffusion_controller

      - name: Read pinned lineartgen commit
        id: lineartgen-ref
        shell: pwsh
        run: |
          $entry = git ls-tree HEAD lineartgen
          if ($LASTEXITCODE -ne 0 -or $entry -notmatch '^160000 commit ([0-9a-f]{40})\s+lineartgen$') {
            throw 'lineartgen must be pinned as a submodule'
          }
          "sha=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Checkout private lineartgen submodule
        uses: actions/checkout@v4
        with:
          repository: White-Green/lineartgen
          ref: ${{ steps.lineartgen-ref.outputs.sha }}
          path: lineartgen
          ssh-key: ${{ secrets.LINEARTGEN_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          architecture: x64

      - name: Test plugin integration
        run: python -m unittest discover -s tests -v

      - name: Build embedded CPU inference extension
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          rust-toolchain: stable
          target: x86_64-pc-windows-msvc
          args: >-
            --release --locked
            --manifest-path lineartgen/crates/lineartgen-native/Cargo.toml
            --out wheels

      - name: Test inference library
        run: >-
          cargo test --release --locked --manifest-path lineartgen/Cargo.toml
          -p lineartgen --no-default-features --features inference-flex --lib

      - name: Package and smoke-test bundled model
        run: >-
          python scripts/package.py --wheel-dir wheels
          --output dist/diffusion_drawing-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: diffusion-drawing-windows-x64
          path: dist/diffusion_drawing-windows-x64.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: diffusion-drawing-windows-x64
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(date --utc +%Y-%m-%dT%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$TAG" --target "$GITHUB_SHA" dist/diffusion_drawing-windows-x64.zip
